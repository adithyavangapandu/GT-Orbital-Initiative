name: Georgia Tech Orbital Initiative

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ambasat-learning-platform/package-lock.json

      - name: Build AmbaSat learning platform
        working-directory: ambasat-learning-platform
        env:
          VITE_BASE_PATH: /GT-Orbital-Initiative/ambasat/
        run: |
          npm ci
          npm run build

      - name: Prepare website
        run: |
          mkdir -p _site/ambasat
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll 2>/dev/null || true
          cp -r ambasat-learning-platform/dist/. _site/ambasat/
          # SPA fallback: Pages serves 404.html for unknown paths, which boots
          # the app's router for deep links like /ambasat/curriculum/<slug>.
          cp _site/ambasat/index.html _site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
